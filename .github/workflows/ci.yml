name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read

  test:
    name: Test
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-mise
      - run: mise run docs:build
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

  gate:
    name: Gate
    if: always()
    needs: [build, test, docs]
    runs-on: ubuntu-latest
    steps:
      - name: Require successful CI jobs
        shell: bash
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          TEST_RESULT: ${{ needs.test.result }}
          DOCS_RESULT: ${{ needs.docs.result }}
        run: |
          if [[ "$BUILD_RESULT" != "success" || "$TEST_RESULT" != "success" || "$DOCS_RESULT" != "success" ]]; then
            echo "::error::Required CI jobs did not succeed (Build: $BUILD_RESULT, Test: $TEST_RESULT, Documentation: $DOCS_RESULT)."
            exit 1
          fi

  deploy-docs:
    name: Deploy documentation
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [gate, docs]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
        with:
          enablement: true
      - id: deployment
        uses: actions/deploy-pages@v5
