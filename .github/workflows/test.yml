name: Test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  SCCACHE_GHA_ENABLED: "true"

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
        with:
          version: 2026.6.6
          experimental: true
      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - uses: Swatinem/rust-cache@v2
      - uses: mozilla-actions/sccache-action@v0.0.10
      - name: Enable sccache for Rust builds
        shell: bash
        run: echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
      - run: mise run fmt
      - run: mise run clippy
      - run: mise run test

  c-abi:
    name: C ABI integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
        with:
          version: 2026.6.6
          experimental: true
      - uses: Swatinem/rust-cache@v2
      - uses: mozilla-actions/sccache-action@v0.0.10
      - name: Enable sccache for Rust builds
        shell: bash
        run: echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
      - run: mise run test:integration:c-abi

  js:
    name: JS packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
        with:
          version: 2026.6.6
          experimental: true
      - uses: Swatinem/rust-cache@v2
      - uses: mozilla-actions/sccache-action@v0.0.10
      - name: Enable sccache for Rust builds
        shell: bash
        run: echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
      - run: mise run test:js

  takanawa-node-native:
    name: takanawa-node (${{ matrix.runtime }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            runtime: linux-x64
            target: x86_64-unknown-linux-gnu
            artifact: takanawa-node-linux-x64-gnu
            artifact_paths: |-
              packages/takanawa-node/takanawa.linux-x64-gnu.node
              packages/takanawa-node/index.js
          - os: macos-15
            runtime: darwin-arm64
            target: aarch64-apple-darwin
            artifact: takanawa-node-darwin-arm64
            artifact_paths: packages/takanawa-node/takanawa.darwin-arm64.node
          - os: windows-2022
            runtime: win32-x64
            target: x86_64-pc-windows-msvc
            artifact: takanawa-node-win32-x64-msvc
            artifact_paths: packages/takanawa-node/takanawa.win32-x64-msvc.node
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
        with:
          version: 2026.6.6
          experimental: true
      - uses: Swatinem/rust-cache@v2
      - uses: mozilla-actions/sccache-action@v0.0.10
      - name: Enable sccache for Rust builds
        shell: bash
        run: echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
      - name: Configure macOS deployment target
        if: runner.os == 'macOS'
        shell: bash
        run: echo "MACOSX_DEPLOYMENT_TARGET=11.0" >> "$GITHUB_ENV"
      - name: Install Node dependencies
        env:
          CI: "true"
        run: pnpm install --frozen-lockfile
      - name: Build and test native addon
        run: |
          pnpm --filter takanawa-node exec napi build --platform --release --target ${{ matrix.target }}
          pnpm --filter takanawa-node run build:ts
          pnpm --filter takanawa-node run test:built
      - name: Verify macOS minimum version
        if: runner.os == 'macOS'
        shell: bash
        run: vtool -show-build packages/takanawa-node/takanawa.darwin-arm64.node | grep -E 'minos[[:space:]]+11\.0'
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact_paths }}
          if-no-files-found: error

  takanawa-node-package:
    name: Assemble takanawa-node npm package
    runs-on: ubuntu-24.04
    needs: takanawa-node-native
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
        with:
          version: 2026.6.6
          experimental: true
      - uses: Swatinem/rust-cache@v2
      - name: Install Node dependencies
        env:
          CI: "true"
        run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          pattern: takanawa-node-*
          path: target/takanawa-node-npm-artifacts
          merge-multiple: true
      - run: cargo run -p xtask -- package-takanawa-node-npm
      - uses: actions/upload-artifact@v4
        with:
          name: takanawa-node-npm-package
          path: target/takanawa-node-npm-package/*.tgz
          if-no-files-found: error

  takanawa-node-installed:
    name: Install takanawa-node (${{ matrix.runtime }})
    runs-on: ${{ matrix.os }}
    needs: takanawa-node-package
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            runtime: linux-x64
          - os: macos-15
            runtime: darwin-arm64
          - os: windows-2022
            runtime: win32-x64
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
        with:
          version: 2026.6.6
          experimental: true
      - uses: actions/download-artifact@v4
        with:
          name: takanawa-node-npm-package
          path: target/takanawa-node-npm-package
      - name: Install and test packed addon
        shell: bash
        env:
          CI: "true"
        run: |
          mkdir -p target/takanawa-node-install-smoke
          cp packages/takanawa-node/__test__/installed.test.mjs target/takanawa-node-install-smoke/
          cd target/takanawa-node-install-smoke
          npm init -y
          pnpm add --ignore-workspace ../takanawa-node-npm-package/*.tgz
          node --test installed.test.mjs

  android:
    name: Android checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
        with:
          version: 2026.6.6
          experimental: true
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - uses: Swatinem/rust-cache@v2
      - uses: mozilla-actions/sccache-action@v0.0.10
      - name: Enable sccache for Rust builds
        shell: bash
        run: echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v4
      - run: mise run check
      - run: mise run check:android
      - uses: actions/upload-artifact@v4
        with:
          name: takanawa-android-aar
          path: android/takanawa-android/build/outputs/aar/takanawa-android-release.aar

  android-maven-local:
    name: Android Maven local dry-run
    runs-on: ubuntu-latest
    needs: android
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
        with:
          version: 2026.6.6
          experimental: true
      - uses: Swatinem/rust-cache@v2
      - uses: mozilla-actions/sccache-action@v0.0.10
      - name: Enable sccache for Rust builds
        shell: bash
        run: echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v4
      - run: mise run publish:android-local

  npm-publish-dry-run:
    name: pnpm publish dry-run
    runs-on: macos-latest
    if: github.ref_type != 'tag'
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
        with:
          version: 2026.6.6
          experimental: true
      - uses: Swatinem/rust-cache@v2
      - uses: mozilla-actions/sccache-action@v0.0.10
      - name: Enable sccache for Rust builds
        shell: bash
        run: echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
      - run: mise run package:apple
      - run: mise run npm:publish-dry-run

  csharp:
    name: C# binding
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
        with:
          version: 2026.6.6
          experimental: true
      - uses: Swatinem/rust-cache@v2
      - uses: mozilla-actions/sccache-action@v0.0.10
      - name: Enable sccache for Rust builds
        shell: bash
        run: echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
      - run: mise run test:csharp
