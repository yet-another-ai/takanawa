name: Test

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  SCCACHE_GHA_ENABLED: "true"

concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-mise
      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - uses: mozilla-actions/sccache-action@v0.0.11
      - name: Enable sccache for Rust builds
        shell: bash
        run: echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
      - run: mise run fmt
      - run: mise run clippy
      - run: mise run test

  c-abi:
    name: C ABI integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-mise
      - uses: mozilla-actions/sccache-action@v0.0.11
      - name: Enable sccache for Rust builds
        shell: bash
        run: echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
      - run: mise run test:integration:c-abi

  csharp:
    name: C# binding
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-mise
      - uses: mozilla-actions/sccache-action@v0.0.11
      - name: Enable sccache for Rust builds
        shell: bash
        run: echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
      - run: mise run test:csharp

  takanawa-node:
    name: takanawa-node (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-15
          - windows-2022
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-mise
      - uses: mozilla-actions/sccache-action@v0.0.11
      - name: Enable sccache for Rust builds
        shell: bash
        run: echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
      - name: Configure macOS deployment target
        if: runner.os == 'macOS'
        shell: bash
        run: echo "MACOSX_DEPLOYMENT_TARGET=11.0" >> "$GITHUB_ENV"
      - run: mise run install:node
      - run: pnpm --filter takanawa-node test
      - name: Verify macOS minimum version
        if: runner.os == 'macOS'
        shell: bash
        run: vtool -show-build packages/takanawa-node/takanawa.darwin-arm64.node | grep -E 'minos[[:space:]]+11\.0'

  android:
    name: Android checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-mise
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - uses: mozilla-actions/sccache-action@v0.0.11
      - name: Enable sccache for Rust builds
        shell: bash
        run: echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v6
      - run: mise run check
      - run: mise run check:android
      - uses: actions/upload-artifact@v7
        with:
          name: takanawa-android-aar-check
          path: android/takanawa-android/build/outputs/aar/takanawa-android-release.aar

  android-maven-local:
    name: Android Maven local dry-run
    runs-on: ubuntu-latest
    needs: android
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-mise
      - uses: mozilla-actions/sccache-action@v0.0.11
      - name: Enable sccache for Rust builds
        shell: bash
        run: echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v6
      - run: mise run publish:android-local

  js:
    name: JS packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-mise
      - run: mise run test:js

  npm-publish-dry-run:
    name: pnpm publish dry-run
    runs-on: macos-latest
    if: github.ref_type != 'tag'
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-mise
      - uses: mozilla-actions/sccache-action@v0.0.11
      - name: Enable sccache for Rust builds
        shell: bash
        run: echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
      - run: mise run package:apple
      - run: mise run npm:publish-dry-run
