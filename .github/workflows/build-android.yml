name: Build Android

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  SCCACHE_GHA_ENABLED: "true"

concurrency:
  group: build-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android AAR release build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-mise
      - uses: mozilla-actions/sccache-action@v0.0.11
      - name: Enable sccache for Rust builds
        shell: bash
        run: echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v6
      - run: mise run package:android-aar
      - run: mise run publish:android-local
      - run: mise run package:gdextension-android
      - run: mise run test:capacitor-android
      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: ./gradlew :android-maven-local-smoke:connectedDebugAndroidTest
      - uses: actions/upload-artifact@v7
        with:
          name: takanawa-android-aar
          path: android/takanawa-android/build/outputs/aar/takanawa-android-release.aar
