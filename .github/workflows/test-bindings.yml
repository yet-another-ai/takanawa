name: Test Bindings

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  SCCACHE_GHA_ENABLED: "true"

concurrency:
  group: test-bindings-${{ github.ref }}
  cancel-in-progress: true

jobs:
  c-abi:
    name: C ABI integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-mise
      - uses: mozilla-actions/sccache-action@v0.0.11
      - name: Enable sccache for Rust builds
        shell: bash
        run: echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
      - run: mise run test:integration:c-abi

  csharp:
    name: C# binding
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-mise
      - uses: mozilla-actions/sccache-action@v0.0.11
      - name: Enable sccache for Rust builds
        shell: bash
        run: echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
      - run: mise run test:csharp
