name: Test Packaging

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  SCCACHE_GHA_ENABLED: "true"

concurrency:
  group: test-packaging-${{ github.ref }}
  cancel-in-progress: true

jobs:
  npm-publish-dry-run:
    name: pnpm publish dry-run
    runs-on: macos-latest
    if: github.ref_type != 'tag'
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-mise
      - uses: mozilla-actions/sccache-action@v0.0.11
      - name: Enable sccache for Rust builds
        shell: bash
        run: echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
      - run: mise run package:apple
      - run: mise run npm:publish-dry-run
