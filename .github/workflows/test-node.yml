name: Test Node

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  SCCACHE_GHA_ENABLED: "true"

concurrency:
  group: test-node-${{ github.ref }}
  cancel-in-progress: true

jobs:
  takanawa-node:
    name: takanawa-node (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-15
          - windows-2022
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          version: 2026.6.6
          experimental: true
      - uses: mozilla-actions/sccache-action@v0.0.11
      - name: Enable sccache for Rust builds
        shell: bash
        run: echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
      - name: Configure macOS deployment target
        if: runner.os == 'macOS'
        shell: bash
        run: echo "MACOSX_DEPLOYMENT_TARGET=11.0" >> "$GITHUB_ENV"
      - run: mise run install:node
      - run: pnpm --filter takanawa-node test
      - name: Verify macOS minimum version
        if: runner.os == 'macOS'
        shell: bash
        run: vtool -show-build packages/takanawa-node/takanawa.darwin-arm64.node | grep -E 'minos[[:space:]]+11\.0'
